<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&J-GEEK | Catálogo Geek</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">S&J<span>-GEEK</span></a>
        </div>
        <nav id="nav-menu">
            <a href="index.html" class="active">Inicio</a>
            <a href="login.html">Iniciar Sesión</a>
        </nav>
    </header>

    <main>
        <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
            <div>
                <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.35rem;">Catálogo Geek</h1>
                <p style="color: var(--text-muted); font-size: 1rem;">Películas, series y anime valorados por la comunidad.</p>
            </div>
            <div id="btn-propose-container" style="display: none;">
                <button id="btn-open-modal" class="btn btn-success">+ Nueva Obra</button>
            </div>
        </div>

        <!-- Filtros y Búsqueda -->
        <section class="filter-bar">
            <input type="text" id="search-input" placeholder="Buscar por título o sinopsis..." style="flex: 2; min-width: 220px;">
            
            <select id="type-filter" style="flex: 1; min-width: 150px;">
                <option value="">Todos los tipos</option>
                <option value="1">Películas</option>
                <option value="2">Series</option>
                <option value="3">Anime</option>
            </select>

            <select id="category-filter" style="flex: 1; min-width: 160px;">
                <option value="">Todos los géneros</option>
            </select>

            <select id="classification-filter" style="flex: 1; min-width: 150px;">
                <option value="">Todas las edades</option>
                <option value="TP">TP (Todo Público)</option>
                <option value="+13">+13 (Adolescentes)</option>
                <option value="+16">+16 (Jóvenes / Adultos)</option>
                <option value="+18">+18 (Adultos)</option>
            </select>

            <select id="order-filter" style="flex: 1; min-width: 160px;">
                <option value="popularidad">Más Populares</option>
                <option value="rating">Mejor Calificadas</option>
                <option value="recientes">Más Recientes</option>
                <option value="bayesiano">Ranking Ponderado</option>
            </select>
        </section>

        <!-- Grilla de Contenidos -->
        <section>
            <div id="content-grid" class="content-grid">
                <p style="color: var(--text-muted); grid-column: 1 / -1; padding: 2rem 0; text-align: center;">Cargando catálogo...</p>
            </div>
        </section>

        <!-- Modal para Proponer Contenido -->
        <div id="modal-propose" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="font-size: 1.25rem;">Registrar Nueva Obra</h3>
                    <button id="btn-close-modal" style="background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer;">&times;</button>
                </div>
                
                <!-- Autocompletado con TMDb -->
                <div style="background: rgba(79, 70, 229, 0.08); border: 1px dashed var(--border-color); padding: 0.85rem; border-radius: 0.375rem; margin-bottom: 1.25rem;">
                    <label style="font-weight: 600; font-size: 0.85rem; color: #a5b4fc; margin-bottom: 0.35rem; display: block;">
                        Buscar en TMDb para autocompletar ficha técnica
                    </label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" id="tmdb-search-input" placeholder="Ej. Interstellar, Arcane..." style="margin-bottom: 0;">
                        <button type="button" id="btn-tmdb-search" class="btn" style="white-space: nowrap;">Buscar</button>
                    </div>
                    <div id="tmdb-results" style="display: none; max-height: 180px; overflow-y: auto; margin-top: 0.5rem; border: 1px solid var(--border-color); border-radius: 0.375rem; background: var(--bg-color);"></div>
                </div>

                <form id="propose-form">
                    <label for="p-titulo">Título *</label>
                    <input type="text" id="p-titulo" placeholder="Título oficial" required>

                    <div style="display: flex; gap: 1rem;">
                        <div style="flex: 1;">
                            <label for="p-tipo">Tipo *</label>
                            <select id="p-tipo" required>
                                <option value="1">Película</option>
                                <option value="2">Serie</option>
                                <option value="3">Anime</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label for="p-categoria">Género *</label>
                            <select id="p-categoria" required>
                                <option value="">Selecciona género...</option>
                            </select>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <div style="flex: 1;">
                            <label for="p-anio">Año *</label>
                            <input type="number" id="p-anio" min="1888" max="2100" placeholder="2024" required>
                        </div>
                        <div style="flex: 1;">
                            <label for="p-clasificacion">Clasificación *</label>
                            <select id="p-clasificacion" required>
                                <option value="+13">+13 (Adolescentes)</option>
                                <option value="TP">TP (Todo Público)</option>
                                <option value="+16">+16 (Jóvenes / Adultos)</option>
                                <option value="+18">+18 (Adultos)</option>
                            </select>
                        </div>
                        <div style="flex: 1;">
                            <label for="p-duracion">Minutos</label>
                            <input type="number" id="p-duracion" min="1" placeholder="120">
                        </div>
                    </div>

                    <div style="background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border-color); padding: 0.85rem; border-radius: 0.375rem; margin-bottom: 1rem;">
                        <label for="p-file" style="font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem; display: block;">
                            Subir foto o portada desde el equipo
                        </label>
                        <input type="file" id="p-file" accept="image/*" style="margin-bottom: 0.5rem;">
                        <div id="p-preview-container" style="display: none; align-items: center; gap: 0.75rem; margin-top: 0.5rem;">
                            <img id="p-preview-img" style="width: 50px; height: 70px; object-fit: cover; border-radius: 0.25rem; border: 1px solid var(--border-color);">
                            <span id="p-preview-name" style="font-size: 0.8rem; color: var(--text-muted);"></span>
                        </div>
                        <input type="hidden" id="p-uploaded-url">
                    </div>

                    <label for="p-imagen">O ingresar URL de Póster / Imagen</label>
                    <input type="url" id="p-imagen" placeholder="https://image.tmdb.org/...">

                    <label for="p-sinopsis">Sinopsis *</label>
                    <textarea id="p-sinopsis" rows="3" placeholder="Descripción breve del argumento..." required></textarea>

                    <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1rem;">
                        <button type="button" id="btn-cancel-modal" class="btn btn-secondary">Cancelar</button>
                        <button type="submit" class="btn btn-success">Guardar Obra</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
