<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&J-GEEK | Detalle</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">S&J<span>-GEEK</span></a>
        </div>
        <nav id="nav-menu">
            <a href="index.html">Inicio</a>
        </nav>
    </header>

    <main>
        <div id="content-detail">
            <p>Cargando detalles...</p>
        </div>

        <section id="add-review-section" style="margin-top: 3rem; display: none;">
            <h3>Publicar una Reseña</h3>
            <form id="review-form" style="margin-top: 1rem; max-width: 600px;">
                <label for="titulo_resena">Título de la Reseña</label>
                <input type="text" id="titulo_resena" required>

                <label for="rating">Calificación (1 al 10)</label>
                <input type="number" id="rating" min="1" max="10" required>

                <label for="comentario">Comentario</label>
                <textarea id="comentario" rows="4" required></textarea>

                <button type="submit" class="btn">Enviar Reseña</button>
            </form>
        </section>

        <section style="margin-top: 3rem;">
            <h3>Reseñas de la Comunidad</h3>
            <div id="reviews-container" style="margin-top: 1rem;">
            </div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/detalle.js"></script>
</body>
</html>
