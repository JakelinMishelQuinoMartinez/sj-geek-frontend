<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&J-GEEK | Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">S&J<span>-GEEK</span></a>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="register.html">Registrarse</a>
        </nav>
    </header>

    <main style="max-width: 400px; margin-top: 3rem;">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Iniciar Sesión</h2>
        <form id="login-form">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" required>

            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Entrar</button>
        </form>
        <p id="error-msg" style="color: var(--danger-color); margin-top: 1rem; text-align: center;"></p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const data = await apiFetch('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                localStorage.setItem('token', data.token);
                localStorage.setItem('rol', data.rol);
                localStorage.setItem('usuario_id', data.usuario_id || data.id);
                window.location.href = 'index.html';
            } catch (error) {
                errorMsg.textContent = error.message;
            }
        });
    </script>
</body>
</html>
