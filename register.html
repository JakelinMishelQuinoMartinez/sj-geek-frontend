<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&J-GEEK | Registro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">S&J<span>-GEEK</span></a>
        </div>
        <nav id="nav-menu">
            <a href="index.html">Inicio</a>
            <a href="login.html">Iniciar Sesión</a>
        </nav>
    </header>

    <main style="max-width: 400px; margin-top: 3rem;">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Crear Cuenta</h2>
        <form id="register-form">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" required>

            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" required>

            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Registrarse</button>
        </form>
        <p id="error-msg" style="color: var(--danger-color); margin-top: 1rem; text-align: center;"></p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthNav();
            const form = document.getElementById('register-form');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const nombre = document.getElementById('nombre').value;
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const errorMsg = document.getElementById('error-msg');

                    try {
                        await apiFetch('/auth/register', {
                            method: 'POST',
                            body: JSON.stringify({ nombre, email, password })
                        });

                        alert('Registro completado con éxito. Por favor inicia sesión.');
                        window.location.href = 'login.html';
                    } catch (error) {
                        errorMsg.textContent = error.message;
                    }
                });
            }
        });
    </script>
</body>
</html>
